{% extends "base.html" %}
{% block title %}风险检查 - 旅游风控系统{% endblock %}
{% block content %}
<h4 class="mb-4">风险检查</h4>

<div class="row">
    <!-- 左侧: 检查表单 -->
    <div class="col-md-5">
        <div class="card stat-card p-4">
            <h6>发起风控检查</h6>
            <form id="checkForm">
                <div class="mb-3">
                    <label class="form-label"><span class="text-danger">*</span> 事件类型</label>
                    <select class="form-select" id="ck_event_type" required>
                        <option value="预订">预订</option>
                        <option value="支付">支付</option>
                        <option value="退改签">退改签</option>
                        <option value="行程开始">行程开始</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label"><span class="text-danger">*</span> 用户ID</label>
                    <input type="text" class="form-control" id="ck_user_id" placeholder="如: 1001" required>
                </div>
                <div class="mb-3">
                    <label class="form-label"><span class="text-danger">*</span> 业务ID (预订订单号/退改签ID)</label>
                    <input type="text" class="form-control" id="ck_source_id" placeholder="如: ord05a5ac8c8cfe4f51" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">订单ID (可选, 预订/支付时自动填充)</label>
                    <input type="text" class="form-control" id="ck_order_id">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="checkBtn">
                    <i class="bi bi-search"></i> 执行检查
                </button>
            </form>
        </div>
    </div>

    <!-- 右侧: 检查结果 -->
    <div class="col-md-7">
        <div class="card stat-card p-4" id="resultPanel" style="display:none;">
            <h6>检查结果</h6>
            <div id="resultContent"></div>
        </div>
        <div class="card stat-card p-4" id="emptyPanel">
            <div class="text-center text-muted py-5">
                <i class="bi bi-shield-check" style="font-size:48px;"></i>
                <p class="mt-3">请在左侧填写信息并发起风控检查</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function riskBadge(level) {
    const cls = {'低':'badge-risk-low','中':'badge-risk-mid','高':'badge-risk-high','极高':'badge-risk-critical'}[level] || 'bg-secondary';
    return `<span class="badge ${cls}">${level}</span>`;
}

function decisionBadge(d) {
    const cls = {'通过':'bg-success','标记':'bg-info','人工审核':'bg-warning','拒绝':'bg-danger'}[d] || 'bg-secondary';
    return `<span class="badge ${cls}">${d}</span>`;
}

// 接收从案件列表跳过来的预填数据 (重做检查功能)
(function prefillFromCase() {
    const raw = sessionStorage.getItem('risk_check_prefill');
    if (!raw) return;
    try {
        const data = JSON.parse(raw);
        const setVal = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
        setVal('ck_event_type', data.event_type);
        setVal('ck_user_id', data.user_id);
        setVal('ck_source_id', data.source_id);
        // 顶部加个提示横幅
        const form = document.getElementById('checkForm');
        if (form && data.case_id) {
            const banner = document.createElement('div');
            banner.className = 'alert alert-info py-2 mb-3';
            banner.innerHTML = `<i class="bi bi-info-circle"></i> 来自案件 <code>${data.case_id}</code> 的重做检查, 已自动填充业务参数`;
            form.parentNode.insertBefore(banner, form);
        }
    } catch (e) {
        console.warn('预填数据解析失败:', e);
    } finally {
        sessionStorage.removeItem('risk_check_prefill');
    }
})();

document.getElementById('checkForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('checkBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 检查中...';

    const data = {
        event_type: document.getElementById('ck_event_type').value,
        user_id: document.getElementById('ck_user_id').value,
        source_id: document.getElementById('ck_source_id').value,
        order_id: document.getElementById('ck_order_id').value || null,
    };

    try {
        const res = await fetch('/api/risk/check', {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
        });
        const result = await res.json();

        if (!res.ok) {
            document.getElementById('resultContent').innerHTML = `<div class="alert alert-danger">${result.detail || '检查失败'}</div>`;
        } else {
            const decisionColor = {'通过':'success','标记':'warning','人工审核':'info','拒绝':'danger'}[result.decision] || 'secondary';
            // 【P4-L5 2026-08-10】撞黑短路场景: assessment_id 以 blacklist_reject 开头,
            // 不走 7 步决策, ml_score=null. 单独渲染"撞黑提示"块, 不显示"未加载模型"误导用户.
            const isBlacklistReject = result.assessment_id === 'blacklist_reject';
            document.getElementById('resultContent').innerHTML = `
                <div class="alert alert-${decisionColor} mb-3">
                    <strong>决策: ${result.decision}</strong> | 评分: <strong>${result.final_score}</strong> | 等级: ${riskBadge(result.risk_level)}
                    ${result.message ? `<div class="mt-1 small">${result.message}</div>` : ''}
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <small class="text-muted">评估ID</small><br><code>${result.assessment_id}</code>
                    </div>
                    <div class="col-md-6">
                        <small class="text-muted">命中规则数</small><br><strong>${result.rule_count}</strong>
                    </div>
                </div>
                ${isBlacklistReject ? `
                <div class="alert alert-warning mb-3">
                    <strong>🚫 撞黑名单短路</strong>
                    <p class="mb-1 small">此请求撞了黑名单, 未走 7 步决策流水线 (不计算特征 / 不匹配规则 / 不调 XGBoost).</p>
                    <p class="mb-0 small">如需解封, 请到 <a href="/blacklist">黑名单管理</a> 移除对应记录.</p>
                </div>` : `
                ${result.triggered_rules.length > 0 ? `
                <h6 class="mt-3">命中规则</h6>
                <table class="table table-sm">
                    <thead><tr><th>规则</th><th>分类</th><th>等级</th><th>分值</th><th>动作</th></tr></thead>
                    <tbody>${result.triggered_rules.map(r => `
                        <tr>
                            <td>${r.rule_name}</td>
                            <td><span class="badge bg-info">${r.rule_category}</span></td>
                            <td>${riskBadge(r.risk_level)}</td>
                            <td>${r.risk_score}</td>
                            <td>${r.action}</td>
                        </tr>
                    `).join('')}</tbody>
                </table>` : '<p class="text-success mt-3">未命中任何规则</p>'}
                <!-- 【P4-L4 2026-08-08】ML 评分 (XGBoost): P(拒绝) + 风险分(sigmoid 校准) + ML 决策, 模型未加载时显示提示 -->
                <h6 class="mt-3">ML 评分 <small class="text-muted">(XGBoost)</small></h6>
                <div class="ml-score-block p-2 bg-light rounded">
                    ${result.ml_score != null
                        ? renderMLScoreBlock(result.ml_score, result.ml_decision)
                        : '<span class="text-muted">未加载模型</span>'}
                </div>
                <details class="mt-3">
                    <summary class="text-muted">特征详情</summary>
                    <pre class="mt-2 bg-light p-2 rounded" style="max-height:300px;overflow:auto;">${JSON.stringify(result.features, null, 2)}</pre>
                </details>`}
            `;
        }
        document.getElementById('resultPanel').style.display = 'block';
        document.getElementById('emptyPanel').style.display = 'none';
    } catch(e) {
        document.getElementById('resultContent').innerHTML = `<div class="alert alert-danger">请求失败: ${e.message}</div>`;
        document.getElementById('resultPanel').style.display = 'block';
        document.getElementById('emptyPanel').style.display = 'none';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-search"></i> 执行检查';
    }
});
</script>
{% endblock %}
