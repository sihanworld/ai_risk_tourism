{% extends "base.html" %}
{% block title %}评估历史 - 旅游风控系统{% endblock %}
{% block content %}
<h4 class="mb-4">评估历史 <small class="text-muted fs-6">全量评估, 含已结案 + 通过/标记 (案件工作台只看待办)</small></h4>

<!-- 筛选 -->
<div class="mb-3 d-flex gap-2 align-items-center flex-wrap">
    <select class="form-select form-select-sm w-auto" id="filterDecision" onchange="loadAssessments(1)">
        <option value="">全部决策</option>
        <option value="通过">通过</option>
        <option value="标记">标记</option>
        <option value="人工审核">人工审核</option>
        <option value="拒绝">拒绝</option>
    </select>
    <select class="form-select form-select-sm w-auto" id="filterLevel" onchange="loadAssessments(1)">
        <option value="">全部等级</option>
        <option value="低">低</option>
        <option value="中">中</option>
        <option value="高">高</option>
        <option value="极高">极高</option>
    </select>
    <select class="form-select form-select-sm w-auto" id="filterEventType" onchange="loadAssessments(1)">
        <option value="">全部事件</option>
        <option value="预订">预订</option>
        <option value="支付">支付</option>
        <option value="退改签">退改签</option>
        <option value="行程开始">行程开始</option>
    </select>
    <input type="text" class="form-control form-control-sm w-auto" id="filterUserId" placeholder="用户ID" onkeydown="if(event.key==='Enter') loadAssessments(1)">
    <span class="text-muted small">每页</span>
    <select class="form-select form-select-sm w-auto" id="pageSize" onchange="onPageSizeChange()">
        <option value="20">20 条</option>
        <option value="50">50 条</option>
        <option value="100">100 条</option>
    </select>
    <button class="btn btn-outline-primary btn-sm" onclick="loadAssessments(1)">查询</button>
    <span class="text-muted small ms-2" id="assessmentsCount"></span>
</div>

<!-- 评估列表 -->
<div class="card stat-card">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>评估ID</th>
                    <th>用户</th>
                    <th>事件</th>
                    <th>评分</th>
                    <th>等级</th>
                    <th>决策</th>
                    <th>命中</th>
                    <th>ML分 (P拒绝)</th>
                    <th>风险分 (sigmoid)</th>
                    <th>时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="assessments-table"></tbody>
        </table>
    </div>
</div>

<nav class="pagination-bottom"><ul class="pagination justify-content-center mb-0" id="pagination"></ul></nav>

<!-- 评估详情模态框 -->
<div class="modal fade" id="assessModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">评估详情</h5><button type="button" class="btn-close-risk" data-bs-dismiss="modal" title="关闭" aria-label="Close"><i class="bi bi-x-lg"></i></button></div>
            <div class="modal-body" id="assessDetailBody">加载中...</div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
const PAGE_SIZE_KEY = 'assessments_pageSize';

// 恢复 pageSize
(function initPageSize() {
    const saved = localStorage.getItem(PAGE_SIZE_KEY) || '20';
    document.getElementById('pageSize').value = saved;
})();

function onPageSizeChange() {
    localStorage.setItem(PAGE_SIZE_KEY, document.getElementById('pageSize').value);
    loadAssessments(1);
}

function levelBadge(level) {
    const cls = {'低':'badge-risk-low','中':'badge-risk-mid','高':'badge-risk-high','极高':'badge-risk-critical'}[level] || 'bg-secondary';
    return `<span class="badge ${cls}">${level}</span>`;
}

function decisionBadge(d) {
    const cls = {'通过':'bg-success','标记':'bg-info','人工审核':'bg-warning','拒绝':'bg-danger'}[d] || 'bg-secondary';
    return `<span class="badge ${cls}">${d}</span>`;
}

async function loadAssessments(page) {
    currentPage = page || 1;
    const decision = document.getElementById('filterDecision').value;
    const riskLevel = document.getElementById('filterLevel').value;
    const eventType = document.getElementById('filterEventType').value;
    const userId = document.getElementById('filterUserId').value.trim();
    const pageSize = document.getElementById('pageSize').value;
    const params = new URLSearchParams({page: currentPage, page_size: pageSize});
    if (decision) params.set('decision', decision);
    if (riskLevel) params.set('risk_level', riskLevel);
    if (eventType) params.set('event_type', eventType);
    if (userId) params.set('user_id', userId);
    const res = await fetch('/api/assessments?' + params);
    const data = await res.json();
    document.getElementById('assessmentsCount').textContent =
        `共 ${data.total} 条, 当前 ${data.items.length} 条/页`;
    const tbody = document.getElementById('assessments-table');
    if (!data.items.length) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted">暂无评估</td></tr>';
    } else {
        tbody.innerHTML = data.items.map(a => `
            <tr>
                <td><code>${a.assessment_id.substring(0,16)}...</code></td>
                <td>${a.user_id}</td>
                <td><span class="badge bg-light text-dark">${a.event_type}</span></td>
                <td><strong>${a.final_score}</strong></td>
                <td>${levelBadge(a.risk_level)}</td>
                <td>${decisionBadge(a.decision)}</td>
                <td>${a.rule_count}</td>
                <td>${a.ml_score != null ? a.ml_score.toFixed(3) : '<span class="text-muted">-</span>'}</td>
                <td>${a.ml_score != null ? mlProbToRiskScore(a.ml_score) : '<span class="text-muted">-</span>'}</td>
                <td>${new Date(a.create_time).toLocaleString('zh-CN')}</td>
                <td><button class="btn btn-outline-primary btn-sm" onclick="viewAssessment('${a.assessment_id}')">详情</button></td>
            </tr>
        `).join('');
    }
    const totalPages = Math.ceil(data.total / pageSize);
    // P4-L4 2026-08-08: 用通用分页组件 (app.js::buildPaginationHtml)
    // 智能省略号, 总页数 > 7 时显示 ...
    document.getElementById('pagination').innerHTML =
        buildPaginationHtml(currentPage, totalPages, pageSize, 'loadAssessments');
}

async function viewAssessment(id) {
    const res = await fetch('/api/assessments/' + id);
    if (!res.ok) { alert('加载详情失败'); return; }
    const a = await res.json();
    let eventDataPretty = '';
    if (a.event_data) {
        try {
            eventDataPretty = `<pre class="bg-light p-2 small">${JSON.stringify(JSON.parse(a.event_data), null, 2)}</pre>`;
        } catch {
            eventDataPretty = `<pre class="bg-light p-2 small">${a.event_data}</pre>`;
        }
    }
    document.getElementById('assessDetailBody').innerHTML = `
        <div class="row">
            <div class="col-md-6">
                <h6>基本信息</h6>
                <table class="table table-sm">
                    <tr><td class="text-muted">评估ID</td><td>${a.assessment_id}</td></tr>
                    <tr><td class="text-muted">用户ID</td><td>${a.user_id}</td></tr>
                    <tr><td class="text-muted">事件类型</td><td>${a.event_type}</td></tr>
                    <tr><td class="text-muted">业务ID</td><td><code>${a.event_source_id || '-'}</code></td></tr>
                    <tr><td class="text-muted">最终评分</td><td><strong>${a.final_score}</strong></td></tr>
                    <tr><td class="text-muted">风险等级</td><td>${levelBadge(a.risk_level)}</td></tr>
                    <tr><td class="text-muted">决策</td><td>${decisionBadge(a.decision)}</td></tr>
                    <tr><td class="text-muted">命中规则数</td><td>${a.rule_count}</td></tr>
                    <tr><td class="text-muted">创建时间</td><td>${new Date(a.create_time).toLocaleString('zh-CN')}</td></tr>
                </table>
            </div>
            <div class="col-md-6">
                <h6>ML 评分 (XGBoost)</h6>
                <div class="ml-score-block p-2 bg-light rounded mb-3">
                    ${a.ml_score != null
                        ? renderMLScoreBlock(a.ml_score, a.ml_decision)
                        : '<span class="text-muted">未加载模型</span>'}
                </div>
                <h6 class="mt-3">命中规则</h6>
                ${a.triggered_rules.length > 0 ? `<table class="table table-sm">
                    <thead><tr><th>规则</th><th>分类</th><th>等级</th><th>分值</th><th>措施</th></tr></thead>
                    <tbody>${a.triggered_rules.map(r => `<tr>
                        <td>${r.rule_name} <code class="small text-muted">${r.rule_id}</code></td>
                        <td>${r.rule_category}</td>
                        <td>${levelBadge(r.risk_level)}</td>
                        <td>${r.risk_score}</td>
                        <td>${r.action}</td>
                    </tr>`).join('')}</tbody>
                </table>` : '<p class="text-muted">无命中规则</p>'}
            </div>
        </div>
        ${eventDataPretty ? `<hr><h6>事件快照 (回溯当时事件数据)</h6>${eventDataPretty}` : ''}
    `;
    new bootstrap.Modal(document.getElementById('assessModal')).show();
}

loadAssessments();
</script>
{% endblock %}
