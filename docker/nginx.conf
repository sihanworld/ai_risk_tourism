# =============================================================================
# AI_Risk nginx 配置 (P4-L3 + P4-L4 2026-08-08)
# 位置: docker/nginx.conf
# 反向代理 FastAPI + 静态文件服务
# 用法: docker-compose.yml 挂载到 /etc/nginx/conf.d/default.conf
# =============================================================================

# 上游 (docker-compose service 名)
upstream ai_risk_app {
    server app:8000;
}

# HTTP server (开发用)
server {
    listen 80;
    server_name _;

    # 访问日志 / 错误日志
    access_log /var/log/nginx/ai_risk_access.log;
    error_log /var/log/nginx/ai_risk_error.log;

    # 客户端 body 大小 (LLM 上传大文本可能 1-2MB)
    client_max_body_size 10M;

    # 静态资源 (CSS / JS / 图片) - 直接 nginx 服务, 不走 Python
    location /static/ {
        alias /app/static/;
        expires 7d;
        access_log off;
    }

    # 健康检查端点 (K8s liveness/readiness probe 用)
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 代理所有其他请求到 FastAPI
    location / {
        proxy_pass http://ai_risk_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (Server-Sent Events) for /api/agent/chat 流式响应
        proxy_buffering off;
        proxy_cache off;
        # 长超时 (LLM 调用可能 30s+)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

